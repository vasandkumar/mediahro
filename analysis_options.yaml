# Project-wide lints: very_good_analysis plus project rules (CLAUDE.md §4).
# Rules that regex lints cannot express are enforced by tools/lints/check_rules.dart.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.pigeon.dart"
    - "**/l10n/gen/**"
    - "**/bindings/*_bindings.dart"
    - "build/**"
  errors:
    avoid_print: error
    avoid_dynamic_calls: error

linter:
  rules:
    public_member_api_docs: false
    avoid_print: true
    avoid_dynamic_calls: true
    avoid_annotating_with_dynamic: true
    lines_longer_than_80_chars: false
    # Dart 3.13 constructor-syntax lints: keep classic constructors until the
    # whole team (and generated code) moves to the new syntax.
    unnecessary_type_name_in_constructor: false
    unnecessary_const_in_enum_constructor: false
