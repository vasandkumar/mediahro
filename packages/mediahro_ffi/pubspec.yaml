name: mediahro_ffi
description: ffigen-generated bindings for Mediahro's native libraries (mpv, vips, jxl, avif, raw, smb2, nfs, curl, archive, ebur128, chromaprint, openmpt, whisper, uchardet, tesseract, cld3, bergamot) and the VirtualFile abstraction.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
dependencies:
  ffi: ^2.2.0
  meta: ^1.19.0
  path: ^1.9.1
dev_dependencies:
  ffigen: ^23.0.0
  test: ^1.31.1
