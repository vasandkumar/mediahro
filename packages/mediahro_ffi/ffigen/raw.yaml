# raw (CDDL-1.0) - image decoding (C3). Headers: .deps-cache/headers/libraw.
# The checked-in bindings are hand-written to this same shape (no libclang on
# the PC); regenerate with ffigen when it is available:
#   (cd packages/mediahro_ffi && dart run ffigen --config ffigen/raw.yaml)
name: LibRawBindings
description: Bindings to raw.
output: ../lib/src/raw/raw_bindings.dart
headers:
  entry-points:
    - ../../../.deps-cache/headers/libraw/include/libraw/libraw.h
  include-directives:
    - '**/libraw/libraw.h'
compiler-opts:
  - '-I../../.deps-cache/headers/libraw/include'
exclude-all-by-default: true
functions:
  include:
    - libraw_init
    - libraw_close
    - libraw_strerror
    - libraw_open_buffer
    - libraw_open_file
    - libraw_unpack
    - libraw_unpack_thumb
    - libraw_dcraw_process
    - libraw_dcraw_make_mem_image
    - libraw_dcraw_make_mem_thumb
    - libraw_dcraw_clear_mem
    - libraw_get_iwidth
    - libraw_get_iheight
    - libraw_set_output_bps
    - libraw_set_output_color
    - libraw_set_demosaic
comments:
  style: any
  length: brief
preamble: |
  // ignore_for_file: type=lint, unused_field
