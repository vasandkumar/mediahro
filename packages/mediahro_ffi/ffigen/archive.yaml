# libarchive (BSD-2-Clause) — FILE-004 archive browsing (ZIP/CBZ/RAR/RAR5/7z/CBR/TAR).
# RAR via libarchive's own reader only (no unrar). Headers:
# .deps-cache/headers/libarchive (ffigen/fetch_headers.py). Regenerate:
#   (cd packages/mediahro_ffi && dart run ffigen --config ffigen/archive.yaml)
name: ArchiveBindings
description: Bindings to libarchive's read API (used from a worker isolate).
output: ../lib/src/archive/archive_bindings.dart
headers:
  entry-points:
    - ../../../.deps-cache/headers/libarchive/include/archive.h
    - ../../../.deps-cache/headers/libarchive/include/archive_entry.h
  include-directives:
    - '**/archive.h'
    - '**/archive_entry.h'
compiler-opts:
  - '-I../../.deps-cache/headers/libarchive/include'
exclude-all-by-default: true
functions:
  include:
    - archive_read_new
    - archive_read_free
    - archive_read_support_filter_all
    - archive_read_support_format_all
    - archive_read_support_format_raw
    - archive_read_open_filename
    - archive_read_open1
    - archive_read_set_read_callback
    - archive_read_set_seek_callback
    - archive_read_set_close_callback
    - archive_read_set_callback_data
    - archive_read_next_header
    - archive_read_data
    - archive_read_data_skip
    - archive_read_has_encrypted_entries
    - archive_read_add_passphrase
    - archive_read_set_options
    - archive_error_string
    - archive_errno
    - archive_format_name
    - archive_entry_pathname_utf8
    - archive_entry_pathname
    - archive_entry_size
    - archive_entry_size_is_set
    - archive_entry_filetype
    - archive_entry_hardlink
    - archive_entry_mtime
    - archive_entry_is_encrypted
    - archive_version_number
structs:
  include:
    - archive
    - archive_entry
typedefs:
  include:
    - archive_read_callback
    - archive_seek_callback
    - archive_close_callback
macros:
  include:
    - ARCHIVE_OK
    - ARCHIVE_EOF
    - ARCHIVE_RETRY
    - ARCHIVE_WARN
    - ARCHIVE_FAILED
    - ARCHIVE_FATAL
    - AE_IFMT
    - AE_IFREG
    - AE_IFDIR
comments:
  style: any
  length: brief
type-map:
  typedefs:
    # Pointer-sized on every target (Windows: __int64 on x64).
    la_ssize_t:
      lib: ffi
      c-type: IntPtr
      dart-type: int
    la_int64_t:
      lib: ffi
      c-type: Int64
      dart-type: int
    # 64-bit everywhere except armeabi-v7a, where it is 32-bit like IntPtr.
    time_t:
      lib: ffi
      c-type: IntPtr
      dart-type: int
preamble: |
  // ignore_for_file: type=lint, unused_field
