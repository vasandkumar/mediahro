# libsmb2 (LGPL-2.1-or-later, dynamic only) — NET-001.
# Headers: .deps-cache/headers/libsmb2 (ffigen/fetch_headers.py) until the
# mediahro-deps archives land (.deps-cache/<platform>/include).
# Regenerate: (cd packages/mediahro_ffi && dart run ffigen --config ffigen/smb2.yaml)
name: Smb2Bindings
description: Bindings to libsmb2 (sync API, used from a worker isolate).
output: ../lib/src/smb2/smb2_bindings.dart
headers:
  entry-points:
    - ../../../.deps-cache/headers/libsmb2/include/smb2/libsmb2.h
  include-directives:
    - '**/smb2/libsmb2.h'
    - '**/smb2/smb2.h'
compiler-opts:
  - '-I../../.deps-cache/headers/libsmb2/include'
  # libsmb2.h expects its includer to provide the C99 types.
  - '-include'
  - 'stdint.h'
  - '-include'
  - 'stddef.h'
  - '-include'
  - 'time.h'
  - '-include'
  - 'smb2/smb2.h'
exclude-all-by-default: true
functions:
  include:
    - smb2_init_context
    - smb2_destroy_context
    - smb2_set_timeout
    - smb2_set_version
    - smb2_get_dialect
    - smb2_set_security_mode
    - smb2_set_seal
    - smb2_set_sign
    - smb2_set_authentication
    - smb2_set_user
    - smb2_set_password
    - smb2_set_domain
    - smb2_set_workstation
    - smb2_connect_share
    - smb2_disconnect_share
    - smb2_get_error
    - smb2_get_nterror
    - smb2_opendir
    - smb2_closedir
    - smb2_readdir
    - smb2_open
    - smb2_close
    - smb2_pread
    - smb2_pwrite
    - smb2_get_max_read_size
    - smb2_get_max_write_size
    - smb2_fstat
    - smb2_stat
    - smb2_unlink
    - smb2_rmdir
    - smb2_mkdir
    - smb2_rename
    - smb2_echo
    - smb2_get_libsmb2Version
structs:
  include:
    - smb2_stat_64
    - smb2dirent
    - smb2_libversion
    - smb2_context
    - smb2dir
    - smb2fh
enums:
  include:
    - smb2_negotiate_version
macros:
  include:
    - SMB2_TYPE_FILE
    - SMB2_TYPE_DIRECTORY
    - SMB2_TYPE_LINK
    - SMB2_NEGOTIATE_SIGNING_ENABLED
    - SMB2_NEGOTIATE_SIGNING_REQUIRED
    - SMB2_SEC_UNDEFINED
    - SMB2_SEC_NTLMSSP
    - SMB2_SEC_KRB5
comments:
  style: any
  length: brief
preamble: |
  // ignore_for_file: type=lint, unused_field
