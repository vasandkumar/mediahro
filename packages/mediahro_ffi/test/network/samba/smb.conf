[global]
  server role = standalone server
  workgroup = MEDIAHRO
  map to guest = Bad User
  guest account = nobody
  restrict anonymous = 0
  server min protocol = SMB2_02
  server signing = auto
  smb encrypt = desired
  host msdfs = yes
  disable netbios = yes
  smb ports = 445
  # Auth decisions in `docker compose logs samba` (guest, signing, encryption).
  log level = 3 auth:3 auth_audit:3 smb2:5

[media]
  path = /srv/media
  read only = no
  valid users = test
  force user = root
  create mask = 0666
  directory mask = 0777

[public]
  path = /srv/media
  guest ok = yes
  read only = yes

[secure]
  path = /srv/media
  valid users = test
  read only = yes
  smb encrypt = required

[dfs]
  path = /srv/dfs
  msdfs root = yes
  guest ok = yes
  read only = yes
