LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule auth_digest_module modules/mod_auth_digest.so
DavLockDB /var/lib/davlock/lock
Alias /basic /srv/media
Alias /digest /srv/media
Alias /health /usr/local/apache2/htdocs/index.html
<Directory /srv/media>
  Dav On
  Options Indexes
  Require all granted
</Directory>
<Location /basic>
  AuthType Basic
  AuthName dav
  AuthUserFile conf/dav.passwd
  Require valid-user
</Location>
<Location /digest>
  AuthType Digest
  AuthName dav
  AuthDigestProvider file
  AuthUserFile conf/dav.digest
  Require valid-user
</Location>
