listen=YES
listen_port=990
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=000
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/srv/media
pasv_enable=YES
pasv_min_port=21111
pasv_max_port=21120
pasv_address=127.0.0.1
seccomp_sandbox=NO
ssl_enable=YES
implicit_ssl=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=NO
# Alpine vsftpd 3.0.5 has no ssl_tlsv1_2 (a Debian patch). With OpenSSL 3,
# ssl_tlsv1=YES allows TLS 1.2 and 1.3; SSLv2/v3 stay off.
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/vsftpd/vsftpd.crt
rsa_private_key_file=/etc/vsftpd/vsftpd.key
xferlog_enable=YES
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
