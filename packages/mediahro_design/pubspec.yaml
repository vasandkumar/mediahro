name: mediahro_design
description: Mediahro design system - tokens, theme builders per platform family, semantic icon map and component library.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  # For package:mediahro_design/testing.dart (golden and a11y harness shared
  # with app tests); never imported from lib/mediahro_design.dart.
  flutter_test:
    sdk: flutter
  meta: ^1.19.0
