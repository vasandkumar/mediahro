# Guard for bookkeeping-only commits (STATUS.md), which no longer start the
# full ci matrix: checks every doc 04 ID is tracked with valid cells.
name: status

on:
  # Owner, 2026-10-20: no GitHub CI for now (lanes rule 8); tools/check runs this locally.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/status/check_status.py
