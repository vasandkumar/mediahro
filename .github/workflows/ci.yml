# CI matrix (docs/10 §5). Every PR runs every job; a feature is proven on a
# platform only by these jobs (docs/10 §8 rule 4).
name: ci

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', 'STATUS.md']
  pull_request:
    paths: ['**', '!docs/**', '!**/*.md', 'STATUS.md']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Format
        run: git ls-files -z '*.dart' | grep -zvE '\.(g|freezed|pigeon)\.dart$|_bindings\.dart$' | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Project rules (no MethodChannel, no direct HTTP, no UI literals, no dynamic, no telemetry SDKs)
        run: dart run tools/lints/check_rules.dart
      - name: Localisation fragments
        run: dart run tools/l10n/merge_arb.dart --check --report
      - name: STATUS.md tracks every doc 04 ID
        run: python3 tools/status/check_status.py
      - name: Store-policy manifest guard
        run: python3 tools/compliance/check_manifests.py
      - name: Tooling tests (l10n pseudo-locales, ICU checks)
        run: if [ -d tools/l10n/test ]; then dart test tools/l10n/test; fi

  test-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Dart packages
        run: |
          for p in packages/mediahro_ffi packages/mediahro_servers packages/mediahro_subtitles; do
            (cd "$p" && dart test --reporter github)
          done
      - name: Flutter packages and app (unit, widget, golden)
        run: |
          for p in packages/mediahro_design packages/mediahro_engine app; do
            (cd "$p" && flutter test --coverage)
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: coverage, path: '**/coverage/lcov.info', if-no-files-found: ignore }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: golden-failures, path: '**/test/failures/**', if-no-files-found: ignore }

  licence-sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Licence scan, configure-flag verification, SBOM
        run: python3 tools/licence_scan/licence_scan.py --require-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: build/sbom.cdx.json }

  build-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: store, artefact: appbundle }
          - { flavor: foss, artefact: apk }
          - { flavor: direct, artefact: apk }
          - { flavor: enterprise, artefact: apk }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Install NDK r28
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Build ${{ matrix.flavor }} ${{ matrix.artefact }}
        working-directory: app
        run: flutter build ${{ matrix.artefact }} --release --flavor ${{ matrix.flavor }} --dart-define=MEDIAHRO_FLAVOR=${{ matrix.flavor }} --split-debug-info=build/symbols --obfuscate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'android-symbols-${{ matrix.flavor }}', path: app/build/symbols, retention-days: 90 }
      - name: 16 KB page alignment (docs/07 §1 rule 4)
        if: matrix.artefact == 'apk'
        run: |
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          for apk in app/build/app/outputs/flutter-apk/*.apk; do "$ZIPALIGN" -c -P 16 -v 4 "$apk" > /dev/null && echo "aligned: $apk"; done
      - name: Install size budget (Android ≤ 75 MB per ABI, ADR-019)
        if: matrix.artefact == 'apk'
        run: python3 tools/perf/size_budget.py android app/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
      - name: Play download size per ABI (reported, docs/11 §5)
        if: matrix.artefact == 'appbundle'
        run: |
          curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum -c -
          AAB=$(ls app/build/app/outputs/bundle/*/*.aab | head -1)
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias ci -dname "CN=CI" -keyalg RSA -validity 1 >/dev/null 2>&1
          java -jar bundletool.jar build-apks --bundle "$AAB" --output app.apks --ks ci.jks --ks-pass pass:android --ks-key-alias ci --key-pass pass:android
          java -jar bundletool.jar get-size total --apks app.apks --dimensions=ABI | tee download-size.csv
          { echo '### Play download size per ABI (bytes)'; echo '```'; cat download-size.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.flavor }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/**/*.aab

  # iOS and both macOS flavours in one job: macOS runners are the scarcest
  # resource, so one setup and one queue slot per PR instead of three.
  build-apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: iOS device build (store, unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign --dart-define=MEDIAHRO_FLAVOR=store --split-debug-info=build/symbols/ios --obfuscate
      - name: iOS simulator build (runnable artefact)
        working-directory: app
        run: |
          flutter build ios --simulator --debug --dart-define=MEDIAHRO_FLAVOR=store
          cd build/ios/iphonesimulator && zip -qr ../../../../mediahro-ios-simulator.zip Runner.app
      - name: macOS builds (store, direct) with size budget
        working-directory: app
        run: |
          for flavor in store direct; do
            flutter build macos --release --dart-define=MEDIAHRO_FLAVOR=$flavor --split-debug-info=build/symbols/macos-$flavor --obfuscate
            python3 ../tools/perf/size_budget.py desktop build/macos/Build/Products/Release/Mediahro.app
            (cd build/macos/Build/Products/Release && ditto -c -k --keepParent Mediahro.app "$GITHUB_WORKSPACE/mediahro-macos-$flavor.zip")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: apple-symbols, path: app/build/symbols, retention-days: 90 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: apple-builds, path: 'mediahro-*.zip' }

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        flavor: [store, direct]
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Build ${{ matrix.flavor }}
        working-directory: app
        run: flutter build windows --release --dart-define=MEDIAHRO_FLAVOR=${{ matrix.flavor }} --split-debug-info=build/symbols --obfuscate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'windows-symbols-${{ matrix.flavor }}', path: app/build/symbols, retention-days: 90 }
      - name: Install size budget (≤ 70 MB, docs/11 §5)
        run: python tools/perf/size_budget.py desktop app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'windows-${{ matrix.flavor }}', path: app/build/windows/x64/runner/Release }

  integration-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Install NDK r28
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Integration tests on API 36 (16 KB page-size image)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          disk-size: 8G
          ram-size: 4096M
          disable-animations: true
          script: mkdir -p build && tools/ci/android_integration.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: android-logcat, path: build/logcat.txt, if-no-files-found: ignore }

  # iOS simulator and macOS integration in one job (one macOS queue slot).
  integration-apple:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: iOS integration tests
        working-directory: app
        run: ../tools/ci/run_integration.sh -d ${{ steps.sim.outputs.udid }} --dart-define=MEDIAHRO_FLAVOR=store
      - name: macOS integration tests
        if: success() || failure()
        working-directory: app
        run: ../tools/ci/run_integration.sh -d macos --dart-define=MEDIAHRO_FLAVOR=direct

  integration-windows:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Integration tests
        working-directory: app
        run: ../tools/ci/run_integration.sh -d windows --dart-define=MEDIAHRO_FLAVOR=direct

  # Profile-mode budgets (docs/11 §5): every integration_test/*_perf_test.dart
  # runs under `flutter drive --profile` on the desktop reference runner and
  # asserts its budget when !kDebugMode. Mobile budgets: device lab.
  perf-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Profile-mode perf tests
        working-directory: app
        run: |
          shopt -s nullglob
          files=(integration_test/*_perf_test.dart)
          if [ ${#files[@]} -eq 0 ]; then echo "::notice::no *_perf_test.dart files yet"; exit 0; fi
          mkdir -p build/perf; status=0
          for f in "${files[@]}"; do
            flutter drive --profile --driver=test_driver/perf_driver.dart --target="$f" -d windows --dart-define=MEDIAHRO_FLAVOR=direct || status=1
            [ -f build/integration_response_data.json ] && mv build/integration_response_data.json "build/perf/$(basename "$f" .dart).json"
          done
          for j in build/perf/*.json; do { echo "### $(basename "$j")"; echo '```json'; cat "$j"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: perf-windows, path: app/build/perf, if-no-files-found: ignore }

  # Real servers for NET-001…005 and FILE-004 (docs/11 §2 network row): protocol
  # evidence on Linux, not a platform cell. Non-blocking until its first green
  # run, then continue-on-error is removed.
  network-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Test-only native libraries (libsmb2/libnfs from pinned sources; libarchive/ebur128/chromaprint/uchardet from Ubuntu)
        run: packages/mediahro_ffi/test/network/build_native.sh "$RUNNER_TEMP/native"
      - name: Seed the shares
        working-directory: packages/mediahro_ffi
        run: dart run test/network/seed.dart test/network/data
      - name: NFS v3/v4 on the host (kernel nfsd)
        run: sudo packages/mediahro_ffi/test/network/nfs_host.sh packages/mediahro_ffi/test/network/data
      - name: Start Samba, Apache WebDAV, Nextcloud, vsftpd (explicit + implicit FTPS), SFTP, MiniDLNA
        working-directory: packages/mediahro_ffi/test/network
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: FFI contract tests (NET-001 SMB, NET-002 NFS, FILE-004 archives over SMB)
        working-directory: packages/mediahro_ffi
        env: { MEDIAHRO_NET_ENV: '1', LD_LIBRARY_PATH: '${{ runner.temp }}/native/lib' }
        run: dart test test/network test/native_contract_test.dart
      - name: App source tests (NET-003 WebDAV + Nextcloud, NET-004 FTP/FTPS, NET-005 DLNA)
        working-directory: app
        env: { MEDIAHRO_NET_ENV: '1' }
        run: flutter test test/core/sources/network_env_test.dart
      - name: Server logs
        if: failure()
        working-directory: packages/mediahro_ffi/test/network
        run: docker compose logs --no-color --tail 200
