# Nightly jobs (docs/10 §5, docs/11 §1): fuzzing, full media corpus, perf on
# reference runners. Targets register themselves under tools/fuzz/targets and
# test-media/corpus; empty registries pass with a notice until lanes add them.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Dart fuzz harness (subtitle, playlist, XMP, M3U parsers; 1 M iterations per target)
        run: |
          shopt -s nullglob
          targets=(tools/fuzz/targets/*.dart)
          if [ ${#targets[@]} -eq 0 ]; then echo "::notice::no fuzz targets registered yet"; exit 0; fi
          for t in "${targets[@]}"; do dart run "$t" --iterations 1000000; done

  corpus:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: true }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: { flutter-version-file: .fvmrc, cache: true }
      - run: tools/bootstrap
      - name: Media corpus harness (docs/11 §1)
        run: |
          if [ ! -f tools/corpus/run.dart ]; then echo "::notice::corpus harness lands with lane B1 (M1)"; exit 0; fi
          dart run tools/corpus/run.dart --report build/corpus-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: 'corpus-${{ matrix.runner }}', path: build/corpus-report.json, if-no-files-found: ignore }
