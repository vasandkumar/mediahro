org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails on Windows when the pub cache (C:) and
# the project (K:) are on different drives ("different roots"); full Kotlin
# compiles of the app module are fast enough.
kotlin.incremental=false
# Native libraries the app opens besides libmpv: their DT_NEEDED closure is
# packaged from the mediahro-deps archive. A library missing from the archive
# is skipped; the feature then reports the library missing. Only libraries
# that libmpv does not already pull in need to be listed, so every library the
# Dart code opens through NativeLibraries belongs here:
#   libvips, libjxl, libjxl_threads, libavif, libraw   images (ADR-037, IMG-001/010)
#   libarchive                                          CBZ/CBR/ZIP/7z (FILE-004)
#   libebur128                                          loudness (AUD-004)
#   libchromaprint                                      duplicate audio (LIB-014)
#   libsmb2, libnfs                                     network shares (NET-001/002)
#   libtesseract (+ libleptonica)                       OCR of image subtitles (SUB-051)
#   libcld3                                             language detection (SUB-051, SUB-053)
#   libbergamot                                         on-device translation (SUB-053)
# Models and language data are not packaged: they are downloaded on demand
# through the allow-listed path. libwhisper waits for SUB-052 (not built).
# A test (native_packaging_test.dart) keeps this list and the Dart code together.
mediahroNativeLibs=libvips.so,libjxl.so,libjxl_threads.so,libavif.so,libraw.so,libarchive.so,libebur128.so,libchromaprint.so,libsmb2.so,libnfs.so,libtesseract.so,libcld3.so,libbergamot.so
