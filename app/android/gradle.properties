org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails on Windows when the pub cache (C:) and
# the project (K:) are on different drives ("different roots"); full Kotlin
# compiles of the app module are fast enough.
kotlin.incremental=false
# Native libraries the app opens besides libmpv (ADR-037, IMG-001/010): their
# DT_NEEDED closure is packaged from the mediahro-deps archive. A library
# missing from the archive is skipped; the image pipeline then falls back.
mediahroNativeLibs=libvips.so,libjxl.so,libjxl_threads.so,libavif.so,libraw.so
