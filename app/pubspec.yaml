name: mediahro
description: "Every file. Every screen. Nothing in the way."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: 1.19.1
  crypto: 3.0.6
  cryptography: 2.7.0
  drift: ^2.35.2
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mediahro_design:
    path: ../packages/mediahro_design
  mediahro_engine:
    path: ../packages/mediahro_engine
  mediahro_ffi:
    path: ../packages/mediahro_ffi
  mediahro_servers:
    path: ../packages/mediahro_servers
  mediahro_subtitles:
    path: ../packages/mediahro_subtitles
  meta: ^1.19.0
  mime: 2.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr: 3.0.2
  shelf: 1.4.2
  sqlite3: ^3.7.1

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  pigeon: ^29.0.10

flutter:
  uses-material-design: true
  generate: true
  assets:
    # MIT-licensed shader presets (VID-038, ADR-034); provenance in
    # features/video/player/bundled_shaders.dart.
    - assets/shaders/
    # Offline GeoNames gazetteer for place names (IMG-007, CC BY 4.0).
    - assets/gazetteer/
  shaders:
    - shaders/pano_equirect.frag
