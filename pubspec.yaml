# Dart pub workspace for the Mediahro monorepo (docs/05 §3).
name: mediahro_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/mediahro_design
  - packages/mediahro_engine
  - packages/mediahro_ffi
  - packages/mediahro_servers
  - packages/mediahro_subtitles
  - tools

dev_dependencies:
  very_good_analysis: ^11.0.0

# ADR-020: iOS and macOS use the system SQLite (FTS5 + JSON, ≥ 3.30, checked
# at every open by checkSqliteSupport); Android and Windows bundle
# package:sqlite3's build. docs/05 §6.
hooks:
  user_defines:
    sqlite3:
      source:
        ios: system
        macos: system
        default: sqlite3
